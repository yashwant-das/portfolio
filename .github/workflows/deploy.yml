name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create config.js from secrets
        run: |
          SPACE_ID="${{ secrets.CONTENTFUL_SPACE_ID }}"
          ACCESS_TOKEN="${{ secrets.CONTENTFUL_ACCESS_TOKEN }}"
          ENVIRONMENT="${{ vars.CONTENTFUL_ENVIRONMENT }}"
          
          if [ -z "$ENVIRONMENT" ]; then
            ENVIRONMENT="master"
          fi
          
          if [ -z "$SPACE_ID" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "⚠️ Contentful secrets not configured. Using fallback data."
            cat > config.js << 'EOF'
          // Contentful Configuration
          // Contentful not configured - using fallback data
          window.CONTENTFUL_CONFIG = {
            spaceId: '',
            accessToken: '',
            environment: 'master'
          };
          EOF
          else
            cat > config.js << EOF
          // Contentful Configuration
          // Generated automatically from GitHub Secrets during deployment
          window.CONTENTFUL_CONFIG = {
            spaceId: '$SPACE_ID',
            accessToken: '$ACCESS_TOKEN',
            environment: '$ENVIRONMENT'
          };
          EOF
          fi
          
          if [ ! -f config.js ]; then
            echo "❌ ERROR: Failed to create config.js"
            exit 1
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      
      - name: Prepare deployment directory
        run: |
          mkdir -p _deploy
          
          cp index.html styles.css script.js config.js fallback-data.json _deploy/ 2>/dev/null || true
          
          if [ -d assets ]; then
            cp -r assets _deploy/
          fi
          
          if [ -f .nojekyll ]; then
            cp .nojekyll _deploy/
          else
            touch _deploy/.nojekyll
          fi
          
          if [ ! -f _deploy/config.js ]; then
            echo "❌ ERROR: config.js not found in deployment directory"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

