name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create config.js from secrets
        run: |
          if [ -z "${{ secrets.CONTENTFUL_SPACE_ID }}" ] || [ -z "${{ secrets.CONTENTFUL_ACCESS_TOKEN }}" ]; then
            echo "Error: CONTENTFUL_SPACE_ID or CONTENTFUL_ACCESS_TOKEN secrets are not set"
            exit 1
          fi
          cat > config.js << EOF
          // Contentful Configuration
          // Generated automatically from GitHub Secrets during deployment
          window.CONTENTFUL_CONFIG = {
            spaceId: '${{ secrets.CONTENTFUL_SPACE_ID }}',
            accessToken: '${{ secrets.CONTENTFUL_ACCESS_TOKEN }}',
            environment: '${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}'
          };
          EOF
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

