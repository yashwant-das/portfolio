name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create config.js from secrets
        run: |
          echo "=== Creating config.js from GitHub Secrets ==="
          echo "Checking for Contentful secrets..."
          
          SPACE_ID="${{ secrets.CONTENTFUL_SPACE_ID }}"
          ACCESS_TOKEN="${{ secrets.CONTENTFUL_ACCESS_TOKEN }}"
          ENVIRONMENT="${{ vars.CONTENTFUL_ENVIRONMENT }}"
          
          # Use 'master' as default if environment variable is not set
          if [ -z "$ENVIRONMENT" ]; then
            ENVIRONMENT="master"
          fi
          
          if [ -z "$SPACE_ID" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "⚠️ Warning: CONTENTFUL_SPACE_ID or CONTENTFUL_ACCESS_TOKEN secrets are not set"
            echo "The site will use fallback-data.json instead of Contentful"
            echo ""
            echo "To enable Contentful:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Add CONTENTFUL_SPACE_ID secret"
            echo "3. Add CONTENTFUL_ACCESS_TOKEN secret"
            echo ""
            # Create empty config.js so the site still works with fallback data
            cat > config.js << 'EOF'
          // Contentful Configuration
          // Contentful not configured - using fallback data
          // To enable Contentful, add CONTENTFUL_SPACE_ID and CONTENTFUL_ACCESS_TOKEN secrets
          window.CONTENTFUL_CONFIG = {
            spaceId: '',
            accessToken: '',
            environment: 'master'
          };
          EOF
            echo "✅ Created config.js with empty values (fallback mode)"
          else
            echo "✅ Contentful secrets found! Creating config.js with credentials..."
            cat > config.js << EOF
          // Contentful Configuration
          // Generated automatically from GitHub Secrets during deployment
          window.CONTENTFUL_CONFIG = {
            spaceId: '$SPACE_ID',
            accessToken: '$ACCESS_TOKEN',
            environment: '$ENVIRONMENT'
          };
          EOF
            echo "✅ config.js created successfully"
            echo "Contentful credentials configured (secrets hidden for security)"
          fi
          echo ""
          echo "=== Verifying config.js was created ==="
          if [ -f config.js ]; then
            echo "✅ config.js file exists"
            echo "File size: $(wc -c < config.js) bytes"
            # Show first few lines only (without secrets)
            echo "File preview (first 3 lines):"
            head -3 config.js | sed 's/accessToken:.*/accessToken: [HIDDEN]/' | sed 's/spaceId:.*/spaceId: [HIDDEN]/'
          else
            echo "❌ ERROR: config.js not found!"
            exit 1
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      
      - name: Prepare deployment directory
        run: |
          echo "=== Preparing deployment directory ==="
          # Create a clean deployment directory
          mkdir -p _deploy
          
          # Copy all essential files, explicitly including config.js
          echo "Copying files to deployment directory..."
          
          # Copy HTML, CSS, JS files
          cp index.html _deploy/ 2>/dev/null || true
          cp styles.css _deploy/ 2>/dev/null || true
          cp script.js _deploy/ 2>/dev/null || true
          cp config.js _deploy/ 2>/dev/null || true
          cp fallback-data.json _deploy/ 2>/dev/null || true
          
          # Copy assets directory
          if [ -d assets ]; then
            cp -r assets _deploy/
          fi
          
          # Ensure .nojekyll exists
          if [ -f .nojekyll ]; then
            cp .nojekyll _deploy/
          else
            touch _deploy/.nojekyll
            echo "Created .nojekyll file"
          fi
          
          echo ""
          echo "=== Verifying deployment directory ==="
          echo "Files in _deploy:"
          ls -la _deploy/
          echo ""
          echo "Checking config.js in deployment directory:"
          if [ -f _deploy/config.js ]; then
            echo "✅ config.js exists in deployment directory"
            echo "File size: $(wc -c < _deploy/config.js) bytes"
            echo "First 3 lines (secrets hidden):"
            head -3 _deploy/config.js | sed 's/accessToken:.*/accessToken: [HIDDEN]/' | sed 's/spaceId:.*/spaceId: [HIDDEN]/'
          else
            echo "❌ ERROR: config.js not found in deployment directory!"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

