name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      
      - name: Prepare deployment directory
        run: |
          mkdir -p _deploy
          
          cp index.html _deploy/
          
          if [ -d css ]; then
            cp -r css _deploy/
          fi
          
          if [ -d js ]; then
            cp -r js _deploy/
          fi
          
          if [ -d data ]; then
            cp -r data _deploy/
          fi
          
          if [ -d assets ]; then
            cp -r assets _deploy/
          fi
          
          if [ -f .nojekyll ]; then
            cp .nojekyll _deploy/
          else
            touch _deploy/.nojekyll
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
