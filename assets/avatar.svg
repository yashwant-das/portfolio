<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Profile avatar placeholder">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="160" cy="160" r="160" fill="url(#avatarGradient)"/>
  
  <!-- Person silhouette -->
  <!-- Head -->
  <circle cx="160" cy="120" r="45" fill="#ffffff" opacity="0.95"/>
  
  <!-- Shoulders/body -->
  <path d="M 100 200 Q 100 180 120 180 L 200 180 Q 220 180 220 200 L 220 240 Q 220 260 200 260 L 120 260 Q 100 260 100 240 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Subtle shadow for depth -->
  <circle cx="160" cy="120" r="45" fill="#000000" opacity="0.1"/>
</svg>
