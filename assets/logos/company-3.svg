<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Company logo placeholder">
  <defs>
    <linearGradient id="logo3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#logo3Gradient)"/>
  
  <!-- Modern geometric logo design -->
  <rect x="20" y="20" width="24" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
  <circle cx="28" cy="28" r="3" fill="url(#logo3Gradient)"/>
  <circle cx="36" cy="28" r="3" fill="url(#logo3Gradient)"/>
  <rect x="24" y="34" width="16" height="3" rx="1.5" fill="url(#logo3Gradient)"/>
</svg>

