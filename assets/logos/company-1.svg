<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Company logo placeholder">
  <defs>
    <linearGradient id="logo1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#logo1Gradient)"/>
  
  <!-- Modern geometric logo design -->
  <circle cx="32" cy="20" r="8" fill="#ffffff" opacity="0.95"/>
  <rect x="20" y="32" width="24" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="20" y="42" width="18" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
</svg>
