<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="page-title">Portfolio</title>
    <meta id="page-description" name="description" content="Portfolio — projects, experience, skills, and contact.">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230f172a'/%3E%3Ctext x='50' y='62' font-size='56' text-anchor='middle' fill='white' font-family='system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'%3EYD%3C/text%3E%3C/svg%3E">
    <script src="config.js"></script>
    <script defer src="script.js"></script>
    <script type="application/ld+json" id="structured-data">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "",
        "url": "",
        "jobTitle": "",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="top">
      <div class="container header-inner">
        <a class="logo" href="#top" aria-label="Home">
          <span class="logo-mark" id="logo-mark"></span>
          <span class="logo-text" id="logo-text"></span>
        </a>

        <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <nav class="site-nav" id="site-nav" data-collapsible>
          <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>

        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-icon sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="theme-icon moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
          <span class="sr-only">Toggle dark mode</span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="home" aria-label="Intro">
        <div class="container hero-inner">
          <div class="hero-copy">
            <h1 class="hero-title" id="hero-name"></h1>
            <p class="hero-subtitle" id="hero-subtitle"></p>
            <p class="hero-summary"></p>
            <div class="hero-cta">
              <a class="btn btn-primary" href="#projects">View Projects</a>
              <a class="btn btn-secondary" id="resume-link" href="" download style="display: none;">Download Resume</a>
            </div>
          </div>
          <figure class="avatar" aria-label="Profile photo">
            <img id="avatar-img" src="assets/avatar.svg" alt="" loading="eager" width="320" height="320">
          </figure>
        </div>
      </section>

      <section class="section" id="about" aria-label="About">
        <div class="container">
          <div class="section-content">
            <h2 id="about-title">About</h2>
            <p id="about-body"></p>
          </div>
        </div>
      </section>

      <section class="section" id="experience" aria-label="Experience">
        <div class="container">
          <div class="section-content">
            <h2 id="experience-title">Experience</h2>
            <ol class="timeline" id="experience-list">
              <!-- Experience entries will be populated by JavaScript -->
            </ol>
          </div>
        </div>
      </section>

      <section class="section" id="projects" aria-label="Projects">
        <div class="container">
          <div class="section-content">
            <h2 id="projects-title">Projects</h2>
            <div class="projects-grid" id="projects-grid">
              <!-- Project cards will be populated by JavaScript -->
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="skills" aria-label="Skills">
        <div class="container">
          <div class="section-content">
            <h2 id="skills-title">Skills</h2>
            <div class="skills-container" id="skills-container">
              <!-- Skills will be populated by JavaScript -->
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="education" aria-label="Education">
        <div class="container">
          <div class="section-content">
            <h2 id="education-title">Education</h2>
            <ul class="edu" id="education-list">
              <!-- Education entries will be populated by JavaScript -->
            </ul>
          </div>
        </div>
      </section>

      <section class="section" id="contact" aria-label="Contact">
        <div class="container">
          <div class="section-content">
            <h2>Contact</h2>
            <p>
              Want to collaborate or say hello? Reach me at
              <a id="contact-email" href="mailto:"></a>.
            </p>
            <p class="contact-cta">Open to collaboration and new opportunities.</p>
            <ul class="social" id="social-list">
              <!-- Social links will be populated by JavaScript -->
            </ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
